name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      skip_verify:
        description: 'Skip draft release verification'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-ready:
    name: Verify draft release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
      is_prerelease: ${{ steps.set-tag.outputs.is_prerelease }}
    steps:
      - name: Set tag name
        id: set-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            IS_PRERELEASE="false"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          
      - name: Wait for the draft release
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_verify != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.set-tag.outputs.tag_name }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            RELEASE_JSON="$(gh release view "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,isDraft,body 2>/dev/null || true)"
            if [ -n "$RELEASE_JSON" ] \
              && [ "$(jq -r '.tagName' <<<"$RELEASE_JSON")" = "${TAG_NAME}" ] \
              && [ "$(jq -r '.isDraft' <<<"$RELEASE_JSON")" = true ] \
              && [ -n "$(jq -r '.body' <<<"$RELEASE_JSON")" ]; then
              echo "Agent-created draft release is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Agent-created draft release was not ready for ${TAG_NAME}." >&2
          exit 1
          
      - name: Create draft release if running manually
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_verify != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.set-tag.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.set-tag.outputs.is_prerelease }}
        shell: bash
        run: |
          if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" 2>/dev/null; then
            gh release create "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG_NAME}" \
              --draft \
              --prerelease="${IS_PRERELEASE}" \
              --generate-notes
            echo "Created draft release: ${TAG_NAME}"
          else
            echo "Release ${TAG_NAME} already exists"
          fi

  build-windows:
    needs: release-ready
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_S3_BUCKET == '' && 'true' || 'false' }}
      VSIGN_CERT_HASH: ${{ vars.VSIGN_CERT_HASH }}
      VSIGN_OPERATOR_SHA1: ${{ vars.VSIGN_OPERATOR_SHA1 }}
      VSIGN_SERVER: ${{ vars.VSIGN_SERVER }}
      VSIGN_TOOL_SHA256: ${{ vars.VSIGN_TOOL_SHA256 }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"
          
      - name: Compute Rust dependency hash
        id: deps-hash
        shell: bash
        run: |
          {
            find . -name Cargo.toml -not -path './target/*' -print0 \
              | sort -z \
              | xargs -0 sed -E '/^version = /d'
            grep -v '^version = ' Cargo.lock
          } | sha256sum | cut -d' ' -f1 | {
            read -r hash
            echo "hash=${hash:0:20}" >> "$GITHUB_OUTPUT"
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: release-${{ matrix.target }}-${{ steps.deps-hash.outputs.hash }}
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-on-failure: true

      - name: Setup Tauri signing key
        shell: bash
        run: |
          echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/updater.key"
          KEY_B64=$(base64 < "$RUNNER_TEMP/updater.key" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Setup TrustAsia VSign
        shell: pwsh
        env:
          VSIGN_OPERATOR_PFX_B64: ${{ secrets.VSIGN_OPERATOR_PFX_B64 }}
          VSIGN_OPERATOR_PWD: ${{ secrets.VSIGN_OPERATOR_PWD }}
        run: ./.github/scripts/setup-vsign.ps1

      - name: Build and sign Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSIGNCODE_OPERATOR_PWD: ${{ secrets.VSIGN_OPERATOR_PWD }}
          VSIGN_KEY_PIN: ${{ secrets.VSIGN_KEY_PIN }}
        with:
          tagName: ${{ needs.release-ready.outputs.tag_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.vsign.conf.json

      - name: Verify Windows bundles
        shell: pwsh
        run: |
          $bundleRoot = "target/${{ matrix.target }}/release/bundle"
          $nsisInstallers = @(
            Get-ChildItem (Join-Path $bundleRoot "nsis") -Filter "*.exe" -File -ErrorAction SilentlyContinue
          )
          $msiInstallers = @(
            Get-ChildItem (Join-Path $bundleRoot "msi") -Filter "*.msi" -File -ErrorAction SilentlyContinue
          )
          if ($nsisInstallers.Count -eq 0) {
            throw "No NSIS installer was produced for ${{ matrix.target }}"
          }
          if ($msiInstallers.Count -eq 0) {
            throw "No MSI installer was produced for ${{ matrix.target }}"
          }
          ./.github/scripts/assert-authenticode.ps1 -Path @(
            $nsisInstallers.FullName
            $msiInstallers.FullName
          )

      - name: Upload Windows portable ZIP
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSIGNCODE_OPERATOR_PWD: ${{ secrets.VSIGN_OPERATOR_PWD }}
          VSIGN_KEY_PIN: ${{ secrets.VSIGN_KEY_PIN }}
        run: |
          $tagName = "${{ needs.release-ready.outputs.tag_name }}"
          $version = $tagName.TrimStart("v")
          $arch = "${{ matrix.arch }}"
          $portableRoot = "portable"
          $portableDir = Join-Path $portableRoot "DBX_${version}_${arch}"
          $zipName = "DBX_${version}_${arch}-portable.zip"
          $exePath = "target/${{ matrix.target }}/release/dbx.exe"
          $cargoMetadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $appVersion = ($cargoMetadata.packages | Where-Object { $_.name -eq "dbx" } | Select-Object -First 1).version

          if (!(Test-Path $exePath)) {
            throw "Missing Windows executable: $exePath"
          }
          if (!$appVersion -or $appVersion -ne $version) {
            throw "Release tag version $version does not match the built DBX package version $appVersion"
          }

          ./.github/scripts/vsign-sign.ps1 -FilePath $exePath
          ./.github/scripts/assert-authenticode.ps1 -Path $exePath

          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath (Join-Path $portableDir "DBX.exe") -Force
          Copy-Item "LICENSE" (Join-Path $portableDir "LICENSE") -Force
          Copy-Item "README.md" (Join-Path $portableDir "README.md") -Force
          Set-Content -Path (Join-Path $portableDir "portable.dbx") -Value "" -NoNewline

          $portableExe = Join-Path $portableDir "DBX.exe"
          $manifest = [ordered]@{
            schema_version = 1
            version = $appVersion
            arch = $arch
            executable = "DBX.exe"
            executable_sha256 = (Get-FileHash -LiteralPath $portableExe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $portableDir "portable-update.json") -Value $manifest -Encoding utf8NoBOM

          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $zipName -Force
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            pnpm tauri signer sign "--password=" $zipName
          } else {
            pnpm tauri signer sign $zipName
          }

          $signatureName = "${zipName}.sig"
          if (!(Test-Path $signatureName)) {
            throw "Missing portable update signature: $signatureName"
          }

          gh release upload $tagName $zipName $signatureName --repo "${env:GITHUB_REPOSITORY}" --clobber

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

      - name: Remove temporary VSign files
        if: always()
        shell: pwsh
        run: |
          $workDir = if ([string]::IsNullOrWhiteSpace($env:VSIGN_WORK_DIR)) {
            Join-Path $env:RUNNER_TEMP "vsign-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          } else {
            $env:VSIGN_WORK_DIR
          }
          if (Test-Path -LiteralPath $workDir) {
            Remove-Item -LiteralPath $workDir -Recurse -Force
          }

  cleanup-release-signatures:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success'
    steps:
      - name: Remove standalone updater signature assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG_NAME="${{ needs.release-ready.outputs.tag_name }}"
          mapfile -t SIG_ASSETS < <(
            gh release view "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name | select(endswith(".sig") and (endswith("-portable.zip.sig") | not))'
          )

          if [ "${#SIG_ASSETS[@]}" -eq 0 ]; then
            echo "No standalone .sig release assets found."
            exit 0
          fi

          for ASSET in "${SIG_ASSETS[@]}"; do
            echo "Deleting release asset: ${ASSET}"
            gh release delete-asset "${TAG_NAME}" "${ASSET}" \
              --repo "${GITHUB_REPOSITORY}" \
              --yes
          done
