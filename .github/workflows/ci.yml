name: Build Tauri Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-targets: true
          cache-on-failure: true

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri (Release)
        run: pnpm tauri build
        env:
          NODE_ENV: production

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: tauri-msi
          path: target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: tauri-portable
          path: target/release/bundle/*.exe
          retention-days: 30
